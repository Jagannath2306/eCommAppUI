<div class="row">
  <div class="col-12 d-flex justify-content-between p-2">
    <h3 class="m-0">Color Setup</h3>
    <button
      *hasPermission="['PRODUCT_LIST', 'create']"
      class="btn btn-primary"
      (click)="openCreateColor()"
    >
      Create Color
    </button>
  </div>
</div>
<div class="row">
  <div class="col-12 p-2">
    <app-data-table
      [columns]="columns"
      [data]="colors()"
      [permissionModule]="permissionModule"
      [imageBaseUrl]="imageBaseUrl"
    >
     <ng-template #tableActions let-row>
        <button
          *hasPermission="[permissionModule, 'edit']"
          class="btn btn-sm btn-outline-primary me-2"
          (click)="onEdit(row)"
        >
          <i class="bi bi-pencil"></i>
        </button>

        <button
          *hasPermission="[permissionModule, 'view']"
          class="btn btn-sm btn-outline-info me-2"
          (click)="onView(row)"
        >
          <i class="bi bi-eye"></i>
        </button>
        <button
          *hasPermission="[permissionModule, 'delete']"
          class="btn btn-sm btn-outline-danger"
          (click)="onDelete(row)"
        >
          <i class="bi bi-trash"></i>
        </button>
      </ng-template>
    </app-data-table>
  </div>
</div>
